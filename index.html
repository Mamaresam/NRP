<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src https://openrouter.ai; img-src 'none'; font-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>چت خصوصی</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>چت خصوصی</h1>
  <div class="bar">
    <span id="modelLabel" class="chip"></span>
    <button id="newBtn" class="ghost" type="button">گفتگوی جدید</button>
    <button id="setBtn" class="ghost" type="button">تنظیمات</button>
  </div>
</header>

<main id="log" aria-live="polite">
  <div id="empty">
    <p class="big">هر چیزی بپرس.</p>
    <p class="small">برای شروع، از «تنظیمات» کلید API و مدل را وارد کن. گفتگوها فقط در همین تب می‌مانند.</p>
  </div>
</main>

<footer>
  <div class="composer">
    <textarea id="input" rows="1" dir="auto" placeholder="پیام خود را بنویس" aria-label="پیام"></textarea>
    <button id="send" type="button">ارسال</button>
  </div>
  <p id="status" class="small" role="status"></p>
</footer>

<dialog id="dlg">
  <div class="panel">
    <h2>تنظیمات</h2>
    <label>کلید API (OpenRouter)
      <input id="key" type="password" autocomplete="off" spellcheck="false" dir="ltr">
    </label>
    <label>مدل
      <input id="model" type="text" autocomplete="off" spellcheck="false" dir="ltr" placeholder="مثلاً provider/model-name">
    </label>
    <label>پیام سیستمی (اختیاری)
      <textarea id="sys" rows="2" dir="auto"></textarea>
    </label>
    <label class="row"><input id="deny" type="checkbox" checked> فقط providerهایی که داده ذخیره نمی‌کنند</label>
    <label class="row"><input id="remember" type="checkbox"> کلید را در این مرورگر نگه دار</label>
    <p class="small">پیش‌فرض: کلید فقط تا بسته شدن تب می‌ماند. هیچ داده‌ای به جز درخواست مستقیم به openrouter.ai ارسال نمی‌شود.</p>
    <div class="actions">
      <button id="wipe" class="ghost danger" type="button">پاک کردن کلید</button>
      <button id="save" type="button">ذخیره</button>
    </div>
  </div>
</dialog>
<script src="app.js"></script>
</body>
</html>
