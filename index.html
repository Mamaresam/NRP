<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src https://openrouter.ai; img-src 'none'; font-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="dark">
<title>Private Chat</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="intro.css">
</head>
<body>
<div id="intro">
  <div class="stage">
    <div class="layer la" id="la"></div>
    <div class="layer lb" id="lb"></div>
    <div class="planet p1" id="p1"></div>
    <div class="planet p2" id="p2"></div>
    <svg id="nn" viewBox="0 0 600 400" aria-hidden="true"></svg>
    <div class="cap t" data-r="0,0,.14,.22"><span class="fa">چت خصوصی</span><span class="en">Private Chat</span>
      <span class="small"><span class="fa">اسکرول کن</span><span class="en">Scroll down</span></span></div>
    <div class="cap" data-r=".2,.26,.36,.42"><span class="fa">فقط کلید تو. فقط مرورگر تو.</span><span class="en">Your key. Your browser.</span></div>
    <div class="cap" data-r=".4,.46,.5,.56"><span class="fa">بدون سرور. بدون ردیابی.</span><span class="en">No server. No tracking.</span></div>
    <div class="cap" data-r=".72,.78,1,1"><span class="fa">آماده‌ی پرتاب</span><span class="en">Ready for launch</span><div class="num" id="count"></div></div>
    <div class="pad" id="pad"></div>
    <div id="rk">
      <div class="flame" id="flame"></div>
      <svg class="rs" id="rs" viewBox="0 0 60 108" aria-hidden="true">
        <path d="M16 70L2 104l14-6zM44 70l14 34-14-6z" fill="#8b7bff"/>
        <path d="M30 4C42 24 46 52 44 92H16C14 52 18 24 30 4Z" fill="#e9ecff"/>
        <circle cx="30" cy="48" r="8" fill="#5de4ff"/>
        <rect x="22" y="92" width="16" height="8" rx="2" fill="#4a4f80"/>
      </svg>
    </div>
    <div class="itop">
      <button id="langBtn2" type="button" dir="ltr">EN | فا</button>
      <button id="skipBtn" type="button"><span class="fa">رد کردن</span><span class="en">Skip</span></button>
    </div>
    <button id="goBtn" class="go tint" type="button"><span class="fa">پرتاب</span><span class="en">Launch</span></button>
    <div class="track"><i id="bar"></i></div>
  </div>
</div>
<div class="flash"></div>

<header>
  <h1 data-i18n="title"></h1>
  <div class="bar">
    <span id="modelLabel" class="chip"></span>
    <button id="langBtn" class="ghost" type="button" dir="ltr"></button>
    <button id="newBtn" class="ghost icon" type="button" data-i18n-label="new">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button id="setBtn" class="ghost icon" type="button" data-i18n-label="settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
    </button>
  </div>
</header>

<main id="log" aria-live="polite">
  <div id="empty">
    <p class="big" data-i18n="askAnything"></p>
    <p class="small" data-i18n="intro"></p>
  </div>
</main>

<footer>
  <div class="composer">
    <textarea id="input" rows="1" dir="auto" data-i18n-ph="placeholder"></textarea>
    <button id="send" class="icon send" type="button">
      <svg class="i-send" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      <svg class="i-stop" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor" stroke="none"/></svg>
    </button>
  </div>
  <p id="status" class="small" role="status"></p>
</footer>

<dialog id="dlg">
  <div class="panel">
    <h2 data-i18n="settings"></h2>
    <label><span data-i18n="apiKey"></span>
      <input id="key" type="password" autocomplete="off" spellcheck="false" dir="ltr">
    </label>
    <label><span data-i18n="model"></span>
      <input id="model" type="text" autocomplete="off" spellcheck="false" dir="ltr" placeholder="provider/model-name">
    </label>
    <label class="row"><input id="deny" type="checkbox" checked> <span data-i18n="deny"></span></label>
    <label class="row"><input id="remember" type="checkbox"> <span data-i18n="remember"></span></label>
    <p class="small" data-i18n="note"></p>
    <div class="actions">
      <button id="wipe" class="ghost danger" type="button" data-i18n="wipe"></button>
      <button id="save" class="tint" type="button" data-i18n="save"></button>
    </div>
  </div>
</dialog>
<script src="app.js"></script>
<script src="intro.js"></script>
</body>
</html>
