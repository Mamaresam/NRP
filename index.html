<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; connect-src https://openrouter.ai; img-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="dark light">
<title>Dark Matter</title>
<script src="theme.js"></script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="intro.css">
<link rel="stylesheet" href="lang.css">
<link rel="stylesheet" href="chat.css">
</head>
<body>
<canvas id="bgfx" aria-hidden="true"></canvas>

<div id="intro">
  <div class="stage">
    <canvas id="sky" aria-hidden="true"></canvas>
    <svg id="nn" viewBox="0 0 600 400" aria-hidden="true"></svg>
    <div class="cap t" data-r="0,0,.14,.22"><span class="fa">چت خصوصی</span><span class="en">Private Chat</span>
      <span class="small"><span class="fa">اسکرول کن</span><span class="en">Scroll down</span></span></div>
    <div class="cap" data-r=".2,.26,.36,.42"><span class="fa">فقط کلید تو. فقط مرورگر تو.</span><span class="en">Your key. Your browser.</span></div>
    <div class="cap" data-r=".4,.46,.5,.56"><span class="fa">بدون سرور. بدون ردیابی.</span><span class="en">No server. No tracking.</span></div>
    <div class="cap" data-r=".72,.78,1,1"><span class="fa">آماده‌ی پرتاب</span><span class="en">Ready for launch</span><div class="num" id="count"></div></div>
    <div id="lang">
      <canvas id="langfx" aria-hidden="true"></canvas>
      <button class="lang-hit" type="button" data-i18n-label="language" aria-expanded="false"></button>
      <button class="sr" type="button" data-l="en" data-i18n="langEn"></button>
      <button class="sr" type="button" data-l="fa" data-i18n="langFa"></button>
    </div>
    <div class="track"><i id="bar"></i></div>
  </div>
</div>
<div class="flash"></div>

<header>
  <h1 data-i18n="title"></h1>
  <div class="bar">
    <span id="modelLabel" class="chip"></span>
    <button id="themeBtn" class="ghost icon" type="button">
      <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
      <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
    <button id="newBtn" class="ghost icon" type="button" data-i18n-label="new">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button id="setBtn" class="ghost icon" type="button" data-i18n-label="settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
  </div>
</header>

<main id="log" aria-live="polite">
  <div id="empty">
    <canvas id="orbit" role="img"></canvas>
  </div>
</main>

<footer>
  <div class="composer">
    <canvas id="cmpfx" aria-hidden="true"></canvas>
    <div class="field">
      <textarea id="input" rows="1" dir="auto" placeholder=" " data-i18n-aria="placeholder"></textarea>
      <span id="ph" aria-hidden="true" data-i18n="placeholder"></span>
    </div>
    <button id="send" class="icon send" type="button">
      <span class="sp1"><span class="sp2"><svg class="i-send" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg></span></span>
      <svg class="i-stop" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor" stroke="none"/></svg>
    </button>
  </div>
  <p id="status" class="small" role="status"></p>
</footer>

<dialog id="dlg">
  <div class="panel">
    <h2 data-i18n="settings"></h2>
    <section>
      <h3 data-i18n="secLang"></h3>
      <div class="seg" role="group">
        <button type="button" data-l="en" data-i18n="langEn"></button>
        <button type="button" data-l="fa" data-i18n="langFa"></button>
      </div>
    </section>
    <section>
      <h3 data-i18n="secApi"></h3>
      <label><span data-i18n="apiKey"></span>
        <input id="key" type="password" autocomplete="off" spellcheck="false" dir="ltr">
      </label>
      <label><span data-i18n="model"></span>
        <input id="model" type="text" autocomplete="off" spellcheck="false" dir="ltr" placeholder="provider/model-name">
      </label>
    </section>
    <section>
      <h3 data-i18n="secPrivacy"></h3>
      <label class="row"><input id="deny" type="checkbox" checked> <span data-i18n="deny"></span></label>
      <label class="row"><input id="remember" type="checkbox"> <span data-i18n="remember"></span></label>
      <p class="small" data-i18n="note"></p>
    </section>
    <div class="actions">
      <button id="wipe" class="ghost danger" type="button" data-i18n="wipe"></button>
      <button id="save" class="tint" type="button" data-i18n="save"></button>
    </div>
  </div>
</dialog>
<script src="app.js"></script>
<script src="chat.js"></script>
<script src="lang.js"></script>
<script src="fx3d.js"></script>
<script src="space.js"></script>
<script src="intro.js"></script>
</body>
</html>
